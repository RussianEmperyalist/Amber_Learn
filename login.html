<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход · Amber Learn</title>
  <style>
    html { visibility: hidden; }
    html.ready { visibility: visible; }
  </style>
  <script>
    window.addEventListener('load', function() {
      document.documentElement.classList.add('ready');
    });
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="./styles/cyberpunk.css?v=5">
  <link rel="stylesheet" href="./styles/layout.css?v=5">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-page">
    <div class="auth-box">
      <h2>ACCESS PORT</h2>

      <div class="auth-tabs">
        <button data-tab="login" class="active" type="button">Вход</button>
        <button data-tab="register" type="button">Регистрация</button>
      </div>

      <form id="authForm">
        <div class="form-group" id="usernameGroup" style="display:none;">
          <label for="username">Позывной</label>
          <input type="text" id="username" autocomplete="username" minlength="3">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" required minlength="8" autocomplete="current-password">
        </div>
        <div class="error-msg" id="err" aria-live="polite"></div>
        <button class="btn btn-primary" type="submit" id="submitBtn" style="width:100%;">
          Подключиться
        </button>
      </form>

      <p class="auth-hint">Аккаунт и прогресс хранятся локально в вашем браузере. Данные не покидают устройство.</p>
    </div>
  </div>

  <div id="toasts"></div>

  <script type="module">
    import { auth } from './scripts/auth.js?v=5';
    import { toast } from './scripts/app.js?v=5';

    let mode = 'login';

    document.querySelectorAll('.auth-tabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        mode = btn.dataset.tab;
        document.querySelectorAll('.auth-tabs button').forEach(b => b.classList.toggle('active', b === btn));
        document.getElementById('usernameGroup').style.display = mode === 'register' ? 'block' : 'none';
        document.getElementById('submitBtn').textContent = mode === 'register' ? 'Создать аккаунт' : 'Подключиться';
        document.getElementById('err').textContent = '';
      });
    });

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      const btn = document.getElementById('submitBtn');
      err.textContent = '';
      btn.disabled = true;

      try {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (mode === 'register') {
          const username = document.getElementById('username').value;
          await auth.register({ email, username, password });
          toast('Аккаунт создан', 'success');
        } else {
          await auth.login({ email, password });
          toast('Подключено', 'success');
        }
        location.href = './dashboard.html';
      } catch (e) {
        err.textContent = '> ' + e.message;
        btn.disabled = false;
      }
    });

     auth.current().then(u => { if (u) location.href = './dashboard.html'; });
  </script>

   <script>
    if ('serviceWorker' in navigator &&
        location.hostname !== 'localhost' &&
        location.hostname !== '127.0.0.1') {
      navigator.serviceWorker.register('./service-worker.js?v=5').then(reg => {
        setInterval(() => reg.update(), 60000);
        if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        reg.addEventListener('updatefound', () => {
          const newSW = reg.installing;
          if (newSW) {
            newSW.addEventListener('statechange', () => {
              if (newSW.state === 'activated' && reg.active) {
                const refreshing = sessionStorage.getItem('refreshing');
                if (!refreshing) {
                  sessionStorage.setItem('refreshing', '1');
                  window.location.reload();
                }
              }
            });
          }
        });
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          const refreshing = sessionStorage.getItem('refreshing');
          if (!refreshing) {
            sessionStorage.setItem('refreshing', '1');
            window.location.reload();
          }
        });
      });
    } else if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(rs => {
        rs.forEach(r => r.unregister());
      });
      if (window.caches) {
        caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
      }
    }
   </script>
</body>
</html>
